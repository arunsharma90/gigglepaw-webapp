<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$GigglePaw Airdrop</title>
    <style>
        body {
            background-color: #0a0a23;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ff7f;
            text-shadow: 2px 2px 4px #000000;
        }
        p {
            font-size: 18px;
            color: #d3d3d3;
        }
        button {
            background-color: #00ff7f;
            color: #000;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0, 255, 127, 0.3);
        }
        button:hover {
            background-color: #00cc66;
        }
        .disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>$GigglePaw Airdrop 🪙</h1>
    <p id="status">Loading...</p>
    <button id="claimButton" onclick="claimAirdrop()">Claim Airdrop</button>
    <p id="result"></p>

    <script src="[invalid url, do not cite]
    <script>
        const telegram = window.Telegram.WebApp;
        telegram.ready();
        const user = telegram.initDataUnsafe.user;
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbw123456789/exec'; // Replace with your web app URL

        // Fetch user data
        fetch(`${scriptUrl}?function=getUserData&user_id=${user.id}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("status").innerText = data.error;
                } else {
                    document.getElementById("status").innerText = `You have ${data.interactions} interactions and ${data.balance} $GPAW.`;
                    const claimButton = document.getElementById("claimButton");
                    if (data.interactions >= 10) {
                        claimButton.onclick = function() {
                            fetch(`${scriptUrl}?function=claimAirdrop&user_id=${user.id}`)
                                .then(response => response.json())
                                .then(data => {
                                    if (data.success) {
                                        alert("Airdrop claimed!");
                                        location.reload();
                                    } else {
                                        alert(data.message);
                                    }
                                });
                        };
                    } else {
                        claimButton.classList.add("disabled");
                        claimButton.disabled = true;
                        claimButton.innerText = "Not Eligible Yet";
                    }
                }
            });
    </script>
</body>
</html>
