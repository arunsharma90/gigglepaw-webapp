<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$GigglePaw</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #ffcc00;
            color: #000;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px;
            font-size: 18px;
        }
        button:hover {
            background-color: #ffaa00;
        }
        #status {
            font-size: 24px;
            margin-top: 20px;
        }
        h1 {
            font-size: 36px;
            color: #ffcc00;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>$GigglePaw 🐾</h1>
    <p>Earn $GigglePaw daily and become a crypto paw-star!</p>
    <button onclick="claimDailyBonus()">Claim Daily $GigglePaw</button>
    <button onclick="viewTasks()">View Tasks</button>
    <button onclick="viewLeaderboard()">Leaderboard</button>
    <p id="status">Points: 0</p>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const telegram = window.Telegram.WebApp;
        telegram.ready();
        const user = telegram.initDataUnsafe.user;
        document.getElementById("status").innerText = `Welcome, ${user?.username || "PawPal"}! Points: 0`;

        let points = 0;
        function claimDailyBonus() {
            points += 10;
            document.getElementById("status").innerText = `Welcome, ${user?.username || "PawPal"}! Points: ${points}`;
            alert("You earned 10 $GigglePaw! 🐾");
        }

        function viewTasks() {
            alert("Tasks:\n1. Join @GigglePawCommunity (+50 $GigglePaw)\n2. Invite a friend (+100 $GigglePaw)");
        }

        function viewLeaderboard() {
            alert("Leaderboard: Coming soon! Keep earning $GigglePaw!");
        }
    </script>
</body>
</html>
